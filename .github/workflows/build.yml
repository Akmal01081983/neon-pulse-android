# Сборка APK при каждом push в main и публикация в релиз «latest».
# Pull request в main — только сборка для проверки (APK в артефактах), пользователям ничего не публикуется
name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['media/**']
  pull_request:
    branches: [main]
    paths-ignore: ['media/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ключ подписи (если задан в Secrets)
        env:
          KS: ${{ secrets.NP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/np.jks; echo "NP_KEYSTORE=$RUNNER_TEMP/np.jks" >> $GITHUB_ENV; fi

      - name: Сборка
        env:
          NP_STORE_PASS: ${{ secrets.NP_STORE_PASS }}
          # Pull request → тестовое приложение с отдельным именем пакета
          NP_TEST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          # ID клиента Google (не секрет) — в настройках репозитория: Variables → NP_GOOGLE_CLIENT_ID
          NP_GOOGLE_CLIENT_ID: ${{ vars.NP_GOOGLE_CLIENT_ID }}
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon 2>&1 | tee build.log || { M=$( { grep -E "^e: " build.log; grep -A30 "What went wrong" build.log; } | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=build::$M"; exit 1; }

      - name: Готовый файл
        run: |
          cp app/build/outputs/apk/release/*.apk NeonPulse.apk
          cp app/build/outputs/bundle/release/*.aab NeonPulse.aab
          if [ -n "$NP_KEYSTORE" ]; then echo "::notice title=sign::release"; else echo "::warning title=sign::debug"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: NeonPulse
          path: |
            NeonPulse.apk
            NeonPulse.aab

      # Pull request: тестовая версия по прямой ссылке …/releases/download/test/NeonPulse.apk
      # (предварительный выпуск, не «latest» — ссылка в боте продолжает отдавать рабочую версию)
      - name: Тестовая версия для проверки
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Neon Pulse — тестовая версия
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.event.pull_request.head.sha }}
          files: NeonPulse.apk

      - name: Релиз
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Neon Pulse ${{ github.run_number }}
          make_latest: true
          files: |
            NeonPulse.apk
            NeonPulse.aab

      # Google Play: каждая сборка main уходит во «Внутреннее тестирование» (internal), если задан ключ сервисного аккаунта.
      # Первую версию владелец загружает в Play Console вручную (файл NeonPulse.aab из релиза) — так требует Google.
      - name: Google Play — внутреннее тестирование
        if: github.event_name != 'pull_request' && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uz.neonpulse.app
          releaseFiles: NeonPulse.aab
          track: internal
          status: completed
